name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m unittest discover -s tests -v
      - run: python -m beefapi_conformance validate
      - run: python -m beefapi_conformance plan --tier release --json > conformance-plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-plan-py${{ matrix.python }}
          path: conformance-plan.json
