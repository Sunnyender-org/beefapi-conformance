[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "beefapi-conformance"
version = "0.1.0"
description = "Real-client and protocol conformance matrix for BeefAPI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
beefapi-conformance = "beefapi_conformance.cli:main"

[project.optional-dependencies]
dev = ["ruff==0.16.5"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
