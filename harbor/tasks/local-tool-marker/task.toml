schema_version = "1.1"

[task]
name = "beefapi-conformance/local-tool-marker"
description = "Verify that an agent can read a workspace file through its native tools"
authors = ["BF Labs"]
keywords = ["beefapi", "conformance", "tools"]

[metadata]
difficulty = "easy"
category = "client-tools"
tags = ["deterministic", "local-file"]

[verifier]
network_mode = "none"
timeout_sec = 60.0

[agent]
network_mode = "none"
timeout_sec = 300.0

[environment]
build_timeout_sec = 120.0
cpus = 1
memory_mb = 1024
storage_mb = 2048
gpus = 0
